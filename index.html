<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 件服飾商品圖文展報 Dashboard</title>
    <!-- 引入 Tailwind CSS 美化樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- 頁首標題 -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">👕 60 件服飾商品圖文展報</h1>
            <p class="text-gray-600">資料來源：TiDB Cloud (`clothing_db`)</p>
        </header>

        <!-- 分類篩選按鈕列 -->
        <div class="flex flex-wrap justify-center gap-3 mb-8">
            <button onclick="filterProducts('all')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow hover:bg-blue-700 transition">全部商品</button>
            <button onclick="filterProducts(1)" class="bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow hover:bg-gray-50 transition border border-gray-200">上衣/T恤</button>
            <button onclick="filterProducts(2)" class="bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow hover:bg-gray-50 transition border border-gray-200">褲款/長褲</button>
            <button onclick="filterProducts(3)" class="bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow hover:bg-gray-50 transition border border-gray-200">外套/大衣</button>
            <button onclick="filterProducts(4)" class="bg-white text-gray-700 px-4 py-2 rounded-lg font-medium shadow hover:bg-gray-50 transition border border-gray-200">裙款/洋裝</button>
        </div>

        <!-- 商品網格區域 -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="col-span-full text-center text-gray-500 py-10">⏳ 正在載入商品資料...</p>
        </div>
    </div>

    <script>
        let allProducts = [];
        const categoryNames = {
            1: '上衣/T恤',
            2: '褲款/長褲',
            3: '外套/大衣',
            4: '裙款/洋裝'
        };

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                // 讀取同目錄下的 products.json
                const response = await fetch('./products.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status} (找不到 products.json 檔案)`);
                }
                
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                console.error('載入失敗:', error);
                grid.innerHTML = `
                    <div class="col-span-full bg-red-50 border border-red-200 rounded-lg p-6 text-center">
                        <p class="text-red-600 font-bold text-lg mb-2">❌ 商品資料載入失敗</p>
                        <p class="text-red-500 text-sm mb-4">${error.message}</p>
                        <p class="text-gray-600 text-xs">請確認 <b>products.json</b> 已上傳至 GitHub <code>schema.sql</code> 儲存庫根目錄。</p>
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">尚無該類別商品</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 border border-gray-100 flex flex-col">
                    <div class="h-64 bg-gray-100 overflow-hidden relative">
                        <img src="${p.image_url || 'https://via.placeholder.com/300x400?text=無圖片'}" 
                             alt="${p.product_name}" 
                             class="w-full h-full object-cover hover:scale-105 transition duration-300"
                             onerror="this.src='https://via.placeholder.com/300x400?text=圖片載入失敗'">
                        <span class="absolute top-2 left-2 bg-blue-500 text-white text-xs px-2 py-1 rounded-full font-semibold shadow">
                            ${categoryNames[p.category_id] || '一般商品'}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800 mb-1">${p.product_name}</h3>
                            <p class="text-xs text-gray-400 mb-3">商品編號: #${p.product_id}</p>
                        </div>
                        <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                            <span class="text-xl font-extrabold text-blue-600">NT$ ${p.price}</span>
                            <span class="text-xs ${p.stock > 0 ? 'text-green-600 bg-green-50' : 'text-red-500 bg-red-50'} font-medium px-2 py-1 rounded">
                                ${p.stock > 0 ? `庫存: ${p.stock}` : '缺貨中'}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(categoryId) {
            if (categoryId === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category_id === categoryId);
                renderProducts(filtered);
            }
        }

        loadProducts();
    </script>
</body>
</html>
